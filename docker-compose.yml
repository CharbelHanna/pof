# The portability contract: if the stack runs here, it runs anywhere.
#
# No vendor primitives, no managed services — Postgres and an S3-compatible
# bucket are the entire infrastructure. Jobs and cron live inside Postgres via
# pg-boss (Phase 2), so there is no Redis and no platform scheduler to add.
#
# Application services (web, worker) are added to this file as they are built
# in Phases 0 and 2.

name: pof

services:
  postgres:
    # Pinned to 18 for native uuidv7(), used as a convenience default on
    # primary keys. Application code still mints UUIDv7 itself — see
    # packages/db/src/schema/columns.ts for why that distinction matters.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pof
      # Consumed by db/init/01-roles.sh on first boot.
      POF_OWNER_PASSWORD: owner_password
      POF_APP_PASSWORD: app_password
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory and
      # expect a SINGLE mount at /var/lib/postgresql. Mounting the old
      # /var/lib/postgresql/data path makes the entrypoint refuse to start.
      - postgres-data:/var/lib/postgresql
      # Runs once, on an empty data directory only. If you change the init
      # script you must `docker compose down -v` for it to run again.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pof']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  storage:
    # Local stand-in for Cloudflare R2 / AWS S3 / Backblaze B2. The
    # StoragePort's S3 adapter talks to all of them with the same code; only
    # STORAGE_ENDPOINT and credentials differ.
    #
    # SeaweedFS rather than MinIO: MinIO deleted minio/minio and minio/mc from
    # Docker Hub in September 2026 and Quay stopped serving them anonymously
    # days later. Community Edition is archived, source-only and unmaintained,
    # so a registry repoint would only have deferred the problem. SeaweedFS is
    # Apache-2.0, actively maintained and pulls anonymously.
    #
    # This is a development convenience only — nothing in the application
    # knows it exists. Production points STORAGE_ENDPOINT at R2 or S3.
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3-identities.json -ip=storage
    ports:
      - '8333:8333'
    volumes:
      - storage-data:/data
      - ./storage/s3-identities.json:/etc/seaweedfs/s3-identities.json:ro
    healthcheck:
      # Two non-obvious details:
      #  - the host is `storage`, not localhost: `-ip=storage` above makes
      #    SeaweedFS bind that interface only, so localhost is not listening.
      #  - 403 counts as healthy. Anonymous ListBuckets is *supposed* to be
      #    denied once identities are configured; demanding a 2xx here would
      #    mark a correctly-secured server as unhealthy forever.
      test:
        - CMD-SHELL
        - wget -S -q -O /dev/null http://storage:8333/ 2>&1 | grep -qE 'HTTP/1\.1 (200|403)'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Applies migrations, then exits. Everything that needs the schema waits for
  # this to complete, so a fresh `docker compose up` converges without anyone
  # remembering to run a migration step by hand.
  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Runs as the schema OWNER — the only role permitted to run DDL.
      DATABASE_MIGRATION_URL: postgresql://pof_owner:owner_password@postgres:5432/pof
    # Runs from the worker's directory because that is where `tsx` is
    # installed — pnpm's isolated node_modules means it is not resolvable from
    # packages/db, whose own devDependencies are not part of this image.
    working_dir: /repo/apps/worker
    command: ['node', '--import', 'tsx', '../../packages/db/src/migrate.ts']
    restart: 'no'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # Compose reads .env automatically, so WEB_PORT there changes both the
      # published port and the origin the app believes it is served from.
      # They must agree: Better Auth validates callbacks against APP_URL.
      APP_URL: ${APP_URL:-http://localhost:${WEB_PORT:-3000}}
      # NOTE: the host is `postgres`, not `localhost`. Inside the compose
      # network services reach each other by service name, so this cannot be
      # the same DATABASE_URL that host-side tools (db:migrate, db:seed,
      # pnpm dev) use — those connect through the published port on localhost.
      # pof_app: unprivileged, non-owner, so RLS genuinely applies.
      DATABASE_URL: postgresql://pof_app:${POF_APP_PASSWORD:-app_password}@postgres:5432/pof
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-not-for-production-use}
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_BUCKET: ${STORAGE_BUCKET:-pof-assets}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-pofdev}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-pofdevsecret}
      STORAGE_FORCE_PATH_STYLE: 'true'
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
    ports:
      - '${WEB_PORT:-3000}:3000'
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:${WEB_PORT:-3000}}
      DATABASE_URL: postgresql://pof_app:${POF_APP_PASSWORD:-app_password}@postgres:5432/pof
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-not-for-production-use}
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_BUCKET: ${STORAGE_BUCKET:-pof-assets}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-pofdev}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-pofdevsecret}
      STORAGE_FORCE_PATH_STYLE: 'true'
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:
