name: CI

on:
  push:
    branches: [main]
    # Release tags. Without this a tag push runs nothing at all — which is
    # how `v0.4.0` came and went without producing a single build.
    tags: ['v*']
  pull_request:

concurrency:
  # Isolation is expressed through the GROUP, not through a conditional
  # cancel-in-progress.
  #
  # On main, the commit SHA is part of the group, so every commit gets a group
  # of its own and no run can ever cancel another — each commit keeps a
  # recorded result. On any other ref the group is just the ref, so pushing a
  # fixup supersedes the run it obsoletes.
  #
  # An earlier attempt used `cancel-in-progress: ${{ github.ref !=
  # 'refs/heads/main' }}` and did NOT work — main runs were still cancelled
  # while queued (the tell is a cancelled run with zero jobs). Keeping the
  # distinction in the group avoids relying on that expression entirely.
  #
  # Tags are grouped like main, for the same reason: a release build that got
  # silently cancelled is precisely the failure this comment exists about, and
  # a release is the worst possible place to lose a recorded result.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.sha || 'shared' }}
  cancel-in-progress: true

env:
  # Node 26 is Active LTS as of 28 October 2026. Pinned here, in .node-version
  # and in the Dockerfiles so the three cannot drift.
  NODE_VERSION: '26'
  # apt, invoked by `playwright install --with-deps`, will block forever on an
  # interactive prompt that nobody can answer on a runner.
  DEBIAN_FRONTEND: noninteractive

jobs:
  quality:
    name: Typecheck & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check

  portable:
    name: Portable packages (protects the mobile path)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # @pof/schemas and @pof/api-client are the two packages a future Expo
      # app will bundle with Metro. A runtime import of a Node builtin in
      # either one breaks that build — months later, when the offending import
      # is load-bearing and expensive to remove. Catch it on the commit that
      # introduces it instead.
      #
      # Type-only imports are fine (they are erased before bundling), so this
      # deliberately ignores `import type` lines.
      - name: No Node builtins in portable packages
        run: |
          set -euo pipefail
          pattern="^\s*import\s+(?!type\b)[^;]*from\s+['\"](node:|fs|path|crypto|os|child_process|stream|util|buffer|http|https|net|tls|zlib|worker_threads)"
          if grep -rPn --include='*.ts' --include='*.tsx' "$pattern" \
               packages/schemas/src packages/api-client/src; then
            echo "::error::A portable package imports a Node builtin at runtime. Metro cannot bundle this."
            exit 1
          fi
          echo "Portable packages are free of runtime Node imports."

  test:
    name: Unit & integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Testcontainers starts a real Postgres 18 and applies the real
      # migrations, so the tenant-isolation suite exercises actual row-level
      # security rather than a mock of it. GitHub runners ship Docker, so no
      # service container or vendor database branch is needed — which is the
      # same portability property the deployment has.
      - run: pnpm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Longer than the other jobs: this one starts containers, runs migrations,
    # provisions a browser and executes the suite across two viewports.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          # Pinned to 24 for this job only, while the rest of CI runs the
          # repo-wide Node version.
          #
          # `playwright install` hangs immediately after the browser download
          # completes — reproducibly, on Node 26, under three different
          # invocations. The same command on Node 23 locally finishes in
          # seconds. Playwright 1.57 declares `node: ">=18"` with no upper
          # bound, but a declared range is not evidence that a version
          # released after it was published actually works.
          #
          # Node 24 is Maintenance LTS and predates Playwright 1.57, so it is
          # the version the release was actually tested against. Revisit when
          # Playwright publishes a release that names Node 26.
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start infrastructure
        # `mail` is Mailpit. The password-reset suite sends through it and
        # reads the message back out of its API, so without it the app cannot
        # send and the tests have no inbox to read.
        run: docker compose up -d postgres storage mail

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U postgres -d pof >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready"; docker compose logs postgres; exit 1

      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8025/api/v1/messages; then
              echo "mailpit ready"; exit 0
            fi
            sleep 2
          done
          echo "mailpit did not become ready"; docker compose logs mail; exit 1

      - run: pnpm db:migrate
        env:
          DATABASE_MIGRATION_URL: postgresql://pof_owner:owner_password@localhost:5432/pof

      # Browsers are ~150MB and unchanged between runs; cache them on the
      # resolved Playwright version so a bump invalidates the cache.
      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Invoked directly rather than through `pnpm --filter ... exec`.
      #
      # The job log shows the Chromium download reaching 100% and then the
      # step producing no further output until the job timeout — the work
      # finishes, the process never exits. Dropping `--with-deps` (so apt is
      # never involved) did not change that, which rules out the earlier
      # theory. The remaining difference from the invocation that works
      # locally is the pnpm filter wrapper, so this uses the local form.
      #
      # `--with-deps` stays off: the ubuntu-latest image already ships
      # Playwright's browser libraries, and if one is ever missing Chromium
      # fails to launch with a clear error in seconds.
      #
      # The step timeout is the belt and braces: should it hang again, it
      # fails in five minutes with the evidence rather than consuming the
      # whole job budget and reporting as "cancelled".
      - name: Install Playwright browser
        timeout-minutes: 5
        working-directory: apps/web
        run: node ./node_modules/@playwright/test/cli.js install chromium

      - run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://pof_app:app_password@localhost:5432/pof
          # The suite runs its own server on 3100 so it never collides with
          # a compose stack on 3000; playwright.config.ts overrides APP_URL
          # to match, but keep them consistent here to avoid confusion.
          APP_URL: http://localhost:3100
          BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long
          STORAGE_BUCKET: pof-assets
          STORAGE_ACCESS_KEY_ID: pofdev
          STORAGE_SECRET_ACCESS_KEY: pofdevsecret

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  docker:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Nothing is published until everything else has passed.
    #
    # This costs the fast parallel signal the image build used to give — it
    # now waits on the e2e suite, the slowest job here. That is the right
    # trade: an image in the registry is something someone can deploy, and
    # publishing one built from a commit whose tests failed turns a red run
    # into a running deployment. On a pull request nothing is pushed anyway,
    # so the only thing lost there is a few minutes of feedback latency.
    needs: [quality, portable, test, e2e]

    # The default token is read-only. `packages: write` is what lets it push
    # to GHCR; no secret to create, rotate or leak. If a push still comes
    # back 403, the repository or organisation is capping the token below
    # what this asks for — Settings → Actions → General → Workflow
    # permissions.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          # `git describe` needs the tags, and checkout fetches none of them
          # by default — it takes a single commit with no refs. Without this
          # the version step below silently degrades to a bare SHA, which is
          # precisely the state this whole mechanism exists to get out of.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      # The single source of truth for what an image calls itself.
      #
      # Deriving it from a tag rather than passing `github.sha` is the whole
      # point: a SHA tells you which commit built, but not which RELEASE it
      # is, so there is no way to say "deploy 0.5.0" and mean anything. A tag
      # is a decision someone made; a SHA is an accident of history.
      #
      # On a pull request the checked-out ref is the merge commit, so this
      # reads `v0.4.0-7-g<sha>` — past the tag, which is honest: a PR build is
      # not a release. `releaseName()` reduces that to `v0.4.0` for display.
      #
      # `--always` keeps this working before the first tag exists, where it
      # degrades to a bare SHA rather than failing the build.
      - name: Derive version from git
        id: version
        run: |
          version=$(git describe --tags --always --dirty)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building as $version"

      # GHCR rather than Docker Hub: no account to create, no secret to
      # manage, no anonymous pull rate limit for whoever deploys this, and it
      # authenticates with the token the run already has. It is also the
      # portable choice despite being GitHub's — an image is an image, and
      # moving to ACR or Docker Hub later is a change to these two lines.
      #
      # Skipped on pull requests: a fork's token is read-only, so logging in
      # would fail the job for a contributor who has done nothing wrong.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Turns a git ref into image tags, so "deploy 0.4.0" finally refers to
      # something that exists:
      #
      #   tag v0.4.0   ->  0.4.0, 0.4, latest
      #   push to main ->  main, sha-3003226
      #
      # The moving tags matter as much as the exact one. `0.4` lets a deploy
      # follow patch releases without being edited, and `main` gives a
      # deployable preview of the default branch. `latest` is attached only
      # by a semver tag, never by a main commit, so it cannot drift ahead of
      # the newest release.
      #
      # Lowercase is not a style choice: registry paths must be lowercase and
      # the GitHub account name is not.
      - name: Image tags for web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/charbelhanna/pof-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Image tags for worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/charbelhanna/pof-worker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      # Proves the portability claim on every commit: if these build, the
      # stack runs on any container host. No vendor build packs involved.
      #
      # On a pull request this still builds and still fails the run if the
      # build breaks — it simply does not publish. The check keeps its value
      # without every PR writing to the registry.
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          # .dockerignore excludes .git, so the image cannot derive this.
          # Passing it here is also what proves the argument is plumbed
          # through — a build that still said `dev` would mean it is not.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The run log should say what a deploy can pull, rather than making
      # someone open the Packages tab to find out what just happened.
      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published \`${{ steps.version.outputs.value }}\`"
            echo
            echo '```'
            echo "${{ steps.meta-web.outputs.tags }}"
            echo "${{ steps.meta-worker.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
