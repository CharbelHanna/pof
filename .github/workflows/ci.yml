name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Isolation is expressed through the GROUP, not through a conditional
  # cancel-in-progress.
  #
  # On main, the commit SHA is part of the group, so every commit gets a group
  # of its own and no run can ever cancel another — each commit keeps a
  # recorded result. On any other ref the group is just the ref, so pushing a
  # fixup supersedes the run it obsoletes.
  #
  # An earlier attempt used `cancel-in-progress: ${{ github.ref !=
  # 'refs/heads/main' }}` and did NOT work — main runs were still cancelled
  # while queued (the tell is a cancelled run with zero jobs). Keeping the
  # distinction in the group avoids relying on that expression entirely.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

env:
  # Node 26 is Active LTS as of 28 October 2026. Pinned here, in .node-version
  # and in the Dockerfiles so the three cannot drift.
  NODE_VERSION: '26'
  # apt, invoked by `playwright install --with-deps`, will block forever on an
  # interactive prompt that nobody can answer on a runner.
  DEBIAN_FRONTEND: noninteractive

jobs:
  quality:
    name: Typecheck & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check

  portable:
    name: Portable packages (protects the mobile path)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # @pof/schemas and @pof/api-client are the two packages a future Expo
      # app will bundle with Metro. A runtime import of a Node builtin in
      # either one breaks that build — months later, when the offending import
      # is load-bearing and expensive to remove. Catch it on the commit that
      # introduces it instead.
      #
      # Type-only imports are fine (they are erased before bundling), so this
      # deliberately ignores `import type` lines.
      - name: No Node builtins in portable packages
        run: |
          set -euo pipefail
          pattern="^\s*import\s+(?!type\b)[^;]*from\s+['\"](node:|fs|path|crypto|os|child_process|stream|util|buffer|http|https|net|tls|zlib|worker_threads)"
          if grep -rPn --include='*.ts' --include='*.tsx' "$pattern" \
               packages/schemas/src packages/api-client/src; then
            echo "::error::A portable package imports a Node builtin at runtime. Metro cannot bundle this."
            exit 1
          fi
          echo "Portable packages are free of runtime Node imports."

  test:
    name: Unit & integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Testcontainers starts a real Postgres 18 and applies the real
      # migrations, so the tenant-isolation suite exercises actual row-level
      # security rather than a mock of it. GitHub runners ship Docker, so no
      # service container or vendor database branch is needed — which is the
      # same portability property the deployment has.
      - run: pnpm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Longer than the other jobs: this one starts containers, runs migrations,
    # provisions a browser and executes the suite across two viewports.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          # Pinned to 24 for this job only, while the rest of CI runs the
          # repo-wide Node version.
          #
          # `playwright install` hangs immediately after the browser download
          # completes — reproducibly, on Node 26, under three different
          # invocations. The same command on Node 23 locally finishes in
          # seconds. Playwright 1.57 declares `node: ">=18"` with no upper
          # bound, but a declared range is not evidence that a version
          # released after it was published actually works.
          #
          # Node 24 is Maintenance LTS and predates Playwright 1.57, so it is
          # the version the release was actually tested against. Revisit when
          # Playwright publishes a release that names Node 26.
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start infrastructure
        run: docker compose up -d postgres storage

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U postgres -d pof >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready"; docker compose logs postgres; exit 1

      - run: pnpm db:migrate
        env:
          DATABASE_MIGRATION_URL: postgresql://pof_owner:owner_password@localhost:5432/pof

      # Browsers are ~150MB and unchanged between runs; cache them on the
      # resolved Playwright version so a bump invalidates the cache.
      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Invoked directly rather than through `pnpm --filter ... exec`.
      #
      # The job log shows the Chromium download reaching 100% and then the
      # step producing no further output until the job timeout — the work
      # finishes, the process never exits. Dropping `--with-deps` (so apt is
      # never involved) did not change that, which rules out the earlier
      # theory. The remaining difference from the invocation that works
      # locally is the pnpm filter wrapper, so this uses the local form.
      #
      # `--with-deps` stays off: the ubuntu-latest image already ships
      # Playwright's browser libraries, and if one is ever missing Chromium
      # fails to launch with a clear error in seconds.
      #
      # The step timeout is the belt and braces: should it hang again, it
      # fails in five minutes with the evidence rather than consuming the
      # whole job budget and reporting as "cancelled".
      - name: Install Playwright browser
        timeout-minutes: 5
        working-directory: apps/web
        run: node ./node_modules/@playwright/test/cli.js install chromium

      - run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://pof_app:app_password@localhost:5432/pof
          APP_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long
          STORAGE_BUCKET: pof-assets
          STORAGE_ACCESS_KEY_ID: pofdev
          STORAGE_SECRET_ACCESS_KEY: pofdevsecret

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  docker:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # Proves the portability claim on every commit: if these build, the
      # stack runs on any container host. No vendor build packs involved.
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
